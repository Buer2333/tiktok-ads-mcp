[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-gmvmax-mcp"
version = "0.2.0"
authors = [
  { name = "Buer2333", email = "13869438+Buer2333@users.noreply.github.com" },
  { name = "Yu Shengnan", email = "yushengnan0525@gmail.com" },
]
description = "Read-only MCP server for the TikTok Business API with first-class GMV Max support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["tiktok", "tiktok-shop", "gmv-max", "ads", "mcp", "marketing", "advertising", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "mcp-retry>=0.1.0",
]

[project.scripts]
tiktok-gmvmax-mcp = "tiktok_ads_mcp.main:cli"
tiktok-ads-mcp = "tiktok_ads_mcp.main:cli"  # pre-0.2 name, kept for existing configs

[project.urls]
Homepage = "https://github.com/Buer2333/tiktok-ads-mcp"
Repository = "https://github.com/Buer2333/tiktok-ads-mcp"
Documentation = "https://github.com/Buer2333/tiktok-ads-mcp#readme"
"Bug Tracker" = "https://github.com/Buer2333/tiktok-ads-mcp/issues"
Changelog = "https://github.com/Buer2333/tiktok-ads-mcp/blob/main/README.md#changelog"
Upstream = "https://github.com/ysntony/tiktok-ads-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]

[tool.pytest.ini_options]
markers = [
    "perf: performance / API-budget regression tests (block merge on regression)",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tiktok_ads_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/tiktok_ads_mcp",
    "/README.md",
    "/LICENSE",
    "/MCP_USAGE.md",
    "/pyproject.toml",
]